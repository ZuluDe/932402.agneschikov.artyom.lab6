<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог книг — Лабораторная №6</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="active">Каталог книг</a>
      <a href="/about">О себе</a>
    </nav>
  </header>

  <main>
    <h1>Каталог книг</h1>

    <form id="filter-form" class="filter-box">
      <input type="text" id="author" placeholder="Автор (например, Tolstoy)">
      <input type="number" id="year" placeholder="Год (например, 1869)">
      <button type="submit">Найти</button>
      <button type="button" id="reset-btn" class="secondary">Сбросить</button>
    </form>

    <div id="books-list" class="list"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
